[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endpointops-mcp"
version = "1.0.0"
description = "EndpointOps-MCP: full read/write MCP server for Microsoft Intune & Entra ID via Microsoft Graph API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sujin Nelladath"}
]
keywords = ["mcp", "intune", "entra-id", "microsoft-graph", "device-management", "ai", "claude", "copilot", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "msal>=1.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/nelladath/EndpointOps-MCP"
Repository = "https://github.com/nelladath/EndpointOps-MCP"
Issues = "https://github.com/nelladath/EndpointOps-MCP/issues"

[project.scripts]
endpointops-mcp = "intune_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["intune_mcp_server"]

